<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopLand Admin</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body">
<div id="login" class="login"><div class="login-card glass"><div class="brand"><span class="brand-gem">◆</span> SHOPLAND</div><h1>ورود به پنل مدیریت</h1><p>دسترسی خصوصی مدیر سایت</p><input id="user" placeholder="نام کاربری"><input id="pass" type="password" placeholder="رمز عبور"><button class="btn primary wide" id="loginBtn">ورود به پنل</button><small id="loginMsg"></small></div></div>
<div id="dashboard" class="dashboard" style="display:none">
<aside class="side"><div class="brand"><span class="brand-gem">◆</span> SHOPLAND</div><button class="active">📊 داشبورد</button><button>📦 سفارش پروژه</button><button>🖼️ نمونه‌کارها</button><button>👥 اعضای تیم</button><button>📢 اطلاعیه‌ها</button><button>⚙️ تنظیمات</button><a href="../" class="back">← مشاهده سایت</a></aside>
<main class="dash-main"><header><div><span class="eyebrow">CONTROL CENTER</span><h1>داشبورد مدیریت</h1></div><button class="btn ghost" id="logout">خروج</button></header>
<div class="stat-grid"><div class="stat">کل سفارش‌ها<b id="total">0</b></div><div class="stat">جدید<b id="newCount">0</b></div><div class="stat">نمونه‌کارها<b>6</b></div><div class="stat">اعضای تیم<b>24</b></div></div>
<section class="panel"><div class="panel-title"><h2>آخرین سفارش‌های پروژه</h2><button class="btn ghost" id="clear">پاک‌کردن سفارش‌ها</button></div><div class="table-wrap"><table><thead><tr><th>نام</th><th>پروژه</th><th>نوع</th><th>بودجه</th><th>راه ارتباطی</th><th>تاریخ</th></tr></thead><tbody id="orders"></tbody></table></div><div id="empty" class="empty">هنوز سفارشی ثبت نشده است.</div></section>
</main></div><script src="admin.js"></script></body></html>
